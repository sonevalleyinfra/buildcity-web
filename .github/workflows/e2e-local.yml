name: e2e-local

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-local:
    name: e2e-local
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: DUMMYPASS
          POSTGRES_DB: buildcity_e2e
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:DUMMYPASS@127.0.0.1:5432/buildcity_e2e
      # Local-stack-only passwords for accounts seeded into the throwaway CI database.
      E2E_VENDOR_PASSWORD: ci-vendor-DUMMYPASS
      E2E_DR_PASSWORD: ci-dr-DUMMYPASS
      E2E_ADMIN_PASSWORD: ci-admin-DUMMYPASS
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install (web)
        run: npm ci
      - name: Install (server)
        run: npm ci
        working-directory: server
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Isolation guard tests
        run: npm run e2e:guard
      - name: E2E (local stack)
        run: npm run e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/report
            e2e/results
          retention-days: 7
          if-no-files-found: ignore
