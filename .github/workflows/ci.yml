name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: DUMMYPASS
          POSTGRES_DB: buildcity_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:DUMMYPASS@localhost:5432/buildcity_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install (web)
        run: npm ci
      - name: Install (server)
        run: npm ci
        working-directory: server
      - name: Lint
        run: npm run lint || true
      - name: Build
        run: npm run build
      - name: Server security tests
        run: npm run test:security
        working-directory: server
      - name: Migration tests
        run: npm run test:migration
        working-directory: server
