name: e2e-staging

# Smoke suite against https://staging.buildcity.in on the merged SHA (ADR 0002 sections 3 and 7).
# The `e2e-staging` check on the commit is what scripts/promote.sh and the `production` branch rule read.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  e2e-staging:
    name: e2e-staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      E2E_BASE_URL: https://staging.buildcity.in
      E2E_VENDOR_PASSWORD: ${{ secrets.E2E_VENDOR_PASSWORD }}
      E2E_DR_PASSWORD: ${{ secrets.E2E_DR_PASSWORD }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require secrets
        run: |
          for v in E2E_VENDOR_PASSWORD E2E_DR_PASSWORD E2E_ADMIN_PASSWORD VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not set"; missing=1; fi
          done
          [ -z "${missing:-}" ]
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for this SHA on Vercel and api-staging (20 min max)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/wait-for-staging.mjs "$GITHUB_SHA"
      - name: E2E (staging)
        run: npx playwright test -c e2e/playwright.config.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: |
            e2e/report
            e2e/results
          retention-days: 7
          if-no-files-found: ignore
